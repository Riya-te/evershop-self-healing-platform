version: '3.8'

services:
  app:
    image: riuu1110/evershop-devops:1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: postgres
    depends_on:
      - database
    ports:
      - "3000:3000"
    networks:
      - myevershop

  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    networks:
      - myevershop

networks:
  myevershop:
    driver: bridge

volumes:
  postgres-data: